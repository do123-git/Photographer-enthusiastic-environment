<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Vòng đời một đơn hàng film từ tìm Film Lab đến lưu trữ và cộng đồng" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="270" rx="16" fill="#faf5ec"/>
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#3a2817">Vòng đời một đơn hàng film</text>

  <!-- step 1 -->
  <g transform="translate(50,66)">
    <rect width="170" height="160" rx="14" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <circle cx="85" cy="32" r="18" fill="#c8832b"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>
    <text x="85" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#3a2817">Tìm Film Lab</text>
    <text x="85" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">So sánh giá, vị trí,</text>
    <text x="85" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">đánh giá cộng đồng</text>
  </g>
  <polygon points="224,146 238,146 231,157" transform="rotate(-90 231 146)" fill="#c8832b"/>

  <!-- step 2 -->
  <g transform="translate(236,66)">
    <rect width="170" height="160" rx="14" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <circle cx="85" cy="32" r="18" fill="#c8832b"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="85" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#3a2817">Đặt dịch vụ</text>
    <text x="85" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">Chọn film, scan, in;</text>
    <text x="85" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">tự gửi hoặc pickup</text>
  </g>
  <polygon points="410,146 424,146 417,157" transform="rotate(-90 417 146)" fill="#c8832b"/>

  <!-- step 3 -->
  <g transform="translate(422,66)">
    <rect width="170" height="160" rx="14" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <circle cx="85" cy="32" r="18" fill="#c8832b"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="85" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#3a2817">Xử lý film</text>
    <text x="85" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">Tráng – rửa – sấy –</text>
    <text x="85" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">scan – QC, real-time</text>
  </g>
  <polygon points="596,146 610,146 603,157" transform="rotate(-90 603 146)" fill="#c8832b"/>

  <!-- step 4 -->
  <g transform="translate(608,66)">
    <rect width="170" height="160" rx="14" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <circle cx="85" cy="32" r="18" fill="#c8832b"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">4</text>
    <text x="85" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#3a2817">Giao scan số</text>
    <text x="85" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">Upload lên cloud,</text>
    <text x="85" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">thông báo cho khách</text>
  </g>
  <polygon points="782,146 796,146 789,157" transform="rotate(-90 789 146)" fill="#c8832b"/>

  <!-- step 5 -->
  <g transform="translate(794,66)">
    <rect width="170" height="160" rx="14" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <circle cx="85" cy="32" r="18" fill="#c8832b"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">5</text>
    <text x="85" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#3a2817">Lưu trữ</text>
    <text x="85" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">Digital Film Archive</text>
    <text x="85" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">kèm metadata film</text>
  </g>
  <polygon points="968,146 982,146 975,157" transform="rotate(-90 975 146)" fill="#c8832b"/>

  <!-- step 6 -->
  <g transform="translate(980,66)">
    <rect width="170" height="160" rx="14" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <circle cx="85" cy="32" r="18" fill="#c8832b"/>
    <text x="85" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">6</text>
    <text x="85" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#3a2817">Cộng đồng</text>
    <text x="85" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">Đánh giá Lab, chợ</text>
    <text x="85" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b4632">thiết bị &amp; kiến thức</text>
  </g>
</svg>
