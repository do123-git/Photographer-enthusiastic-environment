<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Các vai trò trong hệ thống" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="270" rx="16" fill="#faf5ec"/>
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#3a2817">Các vai trò trong hệ thống</text>

  <!-- card 1 -->
  <g transform="translate(70,60)">
    <rect width="200" height="180" rx="12" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v34 h-200 z" fill="#c8832b"/>
    <text x="100" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Photographer</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3a2817">
      <text x="16" y="82">• Đặt &amp; theo dõi đơn</text>
      <text x="16" y="108">• Tải scan, lưu archive</text>
      <text x="16" y="134">• Đánh giá Film Lab</text>
      <text x="16" y="160">• Mua bán thiết bị</text>
    </g>
  </g>
  <!-- card 2 -->
  <g transform="translate(285,60)">
    <rect width="200" height="180" rx="12" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v34 h-200 z" fill="#8a5a2b"/>
    <text x="100" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Film Lab Owner</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3a2817">
      <text x="16" y="82">• Quản lý gói dịch vụ</text>
      <text x="16" y="108">• Cập nhật trạng thái</text>
      <text x="16" y="134">• Upload file scan</text>
      <text x="16" y="160">• Doanh thu &amp; báo cáo</text>
    </g>
  </g>
  <!-- card 3 -->
  <g transform="translate(500,60)">
    <rect width="200" height="180" rx="12" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v34 h-200 z" fill="#4f7a5a"/>
    <text x="100" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Photography Expert</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3a2817">
      <text x="16" y="82">• Đăng bài hướng dẫn</text>
      <text x="16" y="108">• Review film, máy, lab</text>
      <text x="16" y="134">• Tổ chức workshop</text>
      <text x="16" y="160">• Trả lời cộng đồng</text>
    </g>
  </g>
  <!-- card 4 -->
  <g transform="translate(715,60)">
    <rect width="200" height="180" rx="12" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v34 h-200 z" fill="#3d6f93"/>
    <text x="100" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Delivery Partner</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3a2817">
