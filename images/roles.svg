      <text x="16" y="134">• Trả film cho khách</text>
      <text x="16" y="160">• Cập nhật vận chuyển</text>
    </g>
  </g>
  <!-- card 5 -->
  <g transform="translate(930,60)">
    <rect width="200" height="180" rx="12" fill="#ffffff" stroke="#e3d3b5" stroke-width="2"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v34 h-200 z" fill="#8c3b3b"/>
    <text x="100" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">System Admin</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3a2817">
      <text x="16" y="82">• Duyệt Film Lab</text>
      <text x="16" y="108">• Phí &amp; thanh toán</text>
      <text x="16" y="134">• Kiểm duyệt nội dung</text>
