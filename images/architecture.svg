<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Kiến trúc hệ thống: Flutter client, backend Node.js, SQL Server, lưu trữ và dịch vụ bên ngoài" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5a2b"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="16" fill="#faf5ec"/>
  <text x="600" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#3a2817">Kiến trúc hệ thống (module hóa)</text>

  <!-- Row 1: clients -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="60" width="320" height="70" rx="12" fill="#c8832b"/>
    <text x="220" y="90" font-size="16" font-weight="700" fill="#fff">Mobile App (Flutter)</text>
    <text x="220" y="112" font-size="13" fill="#fff5e0">Android &amp; iOS · Photographer</text>

    <rect x="440" y="60" width="320" height="70" rx="12" fill="#c8832b"/>
    <text x="600" y="90" font-size="16" font-weight="700" fill="#fff">Web Portal (Flutter Web)</text>
    <text x="600" y="112" font-size="13" fill="#fff5e0">Film Lab Owner · Expert</text>

    <rect x="820" y="60" width="320" height="70" rx="12" fill="#c8832b"/>
    <text x="980" y="90" font-size="16" font-weight="700" fill="#fff">Admin Web (Flutter Web)</text>
    <text x="980" y="112" font-size="13" fill="#fff5e0">System Administrator</text>
  </g>

  <line x1="220" y1="130" x2="220" y2="172" stroke="#8a5a2b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="600" y1="130" x2="600" y2="172" stroke="#8a5a2b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="980" y1="130" x2="980" y2="172" stroke="#8a5a2b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Row 2: backend -->
  <rect x="60" y="176" width="1080" height="100" rx="14" fill="#ffffff" stroke="#8a5a2b" stroke-width="2"/>
  <text x="80" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a5a2b">Backend Services · RESTful API (Node.js / Express) · JWT + RBAC</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#3a2817">
    <rect x="85" y="220" width="160" height="42" rx="8" fill="#f3e6d0"/><text x="165" y="246">Auth &amp; Users</text>
    <rect x="259" y="220" width="160" height="42" rx="8" fill="#f3e6d0"/><text x="339" y="246">Film Labs &amp; Orders</text>
    <rect x="433" y="220" width="160" height="42" rx="8" fill="#f3e6d0"/><text x="513" y="246">Workflow &amp; Tracking</text>
    <rect x="607" y="220" width="160" height="42" rx="8" fill="#f3e6d0"/><text x="687" y="246">Digital Archive</text>
    <rect x="781" y="220" width="160" height="42" rx="8" fill="#f3e6d0"/><text x="861" y="246">Marketplace</text>
    <rect x="955" y="220" width="160" height="42" rx="8" fill="#f3e6d0"/><text x="1035" y="246">Community</text>
  </g>

  <line x1="600" y1="276" x2="600" y2="326" stroke="#8a5a2b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Row 3: data -->
  <rect x="60" y="330" width="1080" height="110" rx="14" fill="#ffffff" stroke="#3d6f93" stroke-width="2"/>
  <text x="80" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#3d6f93">Database</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#3a2817">
    <rect x="85" y="378" width="520" height="42" rx="8" fill="#dcebf5"/><text x="345" y="404">SQL Server (dữ liệu nghiệp vụ &amp; file scan)</text>
    <rect x="625" y="378" width="490" height="42" rx="8" fill="#dcebf5"/><text x="870" y="404">Elasticsearch / OpenSearch (tìm kiếm)</text>
  </g>

  <line x1="600" y1="440" x2="600" y2="486" stroke="#8a5a2b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Row 4: external -->
  <rect x="60" y="490" width="1080" height="100" rx="14" fill="#ffffff" stroke="#4f7a5a" stroke-width="2"/>
  <text x="80" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4f7a5a">Dịch vụ bên ngoài &amp; hạ tầng</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#3a2817">
    <rect x="85" y="535" width="330" height="40" rx="8" fill="#dfeee3"/><text x="250" y="560">Payment Gateway</text>
    <rect x="435" y="535" width="330" height="40" rx="8" fill="#dfeee3"/><text x="600" y="560">Ahamove / Lalamove (logistics)</text>
    <rect x="785" y="535" width="330" height="40" rx="8" fill="#dfeee3"/><text x="950" y="560">Microsoft Azure · GitHub Actions CI/CD</text>
  </g>
</svg>
