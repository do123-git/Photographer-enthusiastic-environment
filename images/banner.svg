<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Banner: Nền tảng kết nối cộng đồng nhiếp ảnh phim và Film Lab (MiniLab)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100c"/>
      <stop offset="1" stop-color="#3a2817"/>
    </linearGradient>
    <pattern id="holes" width="36" height="40" patternUnits="userSpaceOnUse">
      <rect x="10" y="12" width="16" height="16" rx="3" fill="#f3e6d0"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- film strip top & bottom -->
  <rect y="0" width="1200" height="40" fill="#0b0805"/>
  <rect y="0" width="1200" height="40" fill="url(#holes)" opacity="0.85"/>
  <rect y="340" width="1200" height="40" fill="#0b0805"/>
  <rect y="340" width="1200" height="40" fill="url(#holes)" opacity="0.85"/>

  <!-- text -->
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#d9a441">CAPSTONE PROJECT · NHÓM 8</text>
  <text x="60" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Nền tảng kết nối cộng đồng</text>
  <text x="60" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">nhiếp ảnh phim &amp; Film Lab</text>
  <text x="60" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#d9a441">(MiniLab)</text>
  <text x="60" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#e8d9bf">Platform Connecting Film Photography Enthusiasts with Film Labs</text>

  <!-- frame 1: lens -->
  <rect x="760" y="115" width="120" height="150" rx="6" fill="#231a12" stroke="#d9a441" stroke-width="3"/>
  <circle cx="820" cy="190" r="36" fill="none" stroke="#d9a441" stroke-width="4"/>
  <circle cx="820" cy="190" r="20" fill="none" stroke="#f3e6d0" stroke-width="3"/>
  <circle cx="820" cy="190" r="6" fill="#d9a441"/>

  <!-- frame 2: landscape -->
  <rect x="900" y="115" width="120" height="150" rx="6" fill="#231a12" stroke="#d9a441" stroke-width="3"/>
  <circle cx="985" cy="150" r="11" fill="#f3e6d0"/>
  <polygon points="915,245 955,175 985,215 1000,195 1008,245" fill="#d9a441"/>

  <!-- frame 3: film reel -->
  <rect x="1040" y="115" width="120" height="150" rx="6" fill="#231a12" stroke="#d9a441" stroke-width="3"/>
  <circle cx="1100" cy="190" r="38" fill="none" stroke="#d9a441" stroke-width="4"/>
  <circle cx="1100" cy="190" r="9" fill="#f3e6d0"/>
  <circle cx="1100" cy="165" r="8" fill="none" stroke="#f3e6d0" stroke-width="3"/>
  <circle cx="1122" cy="203" r="8" fill="none" stroke="#f3e6d0" stroke-width="3"/>
  <circle cx="1078" cy="203" r="8" fill="none" stroke="#f3e6d0" stroke-width="3"/>
</svg>
